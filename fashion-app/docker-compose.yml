services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
      - PUBLIC_BASE_URL=http://localhost:3000
    volumes:
      - fashion-temp:/tmp/fashion-app-images
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  fashion-temp:
