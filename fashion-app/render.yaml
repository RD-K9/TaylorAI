services:
  - type: web
    name: fashion-app-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 180 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: POLLINATIONS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
