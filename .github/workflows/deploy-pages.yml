name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fashion-app/frontend/package-lock.json

      - name: Build frontend
        working-directory: fashion-app/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /TaylorAI/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: fashion-app/frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
