name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magic-markdown-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: magic-markdown-fe/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /TaylorAI/

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_smoke.py
